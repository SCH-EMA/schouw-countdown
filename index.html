<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Schouw & Co. Capital Markets Day</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      background: #00425c;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .countdown-wrapper {
      width: 100%;
      min-height: 250px;
      padding: 34px 24px 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .countdown {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      line-height: 1.15;
      font-weight: 400;
    }

    .numbers {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 46px;
    }

    .unit {
      min-width: 95px;
    }

    .number {
      display: block;
      font-size: 48px;
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      line-height: 1;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .date {
      margin-top: 30px;
      font-size: 16px;
      line-height: 1.4;
    }

    .finished-message {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.3;
    }

    @media (max-width: 700px) {
      .countdown-wrapper {
        min-height: 230px;
        padding: 28px 18px;
      }

      h1 {
        margin-bottom: 24px;
        font-size: 28px;
      }

      .numbers {
        gap: 20px;
      }

      .unit {
        min-width: 65px;
      }

      .number {
        font-size: 38px;
      }

      .label {
        margin-top: 8px;
        font-size: 10px;
        letter-spacing: 1.2px;
      }

      .date {
        margin-top: 24px;
        font-size: 14px;
      }
    }

    @media (max-width: 440px) {
      .countdown-wrapper {
        min-height: 300px;
      }

      h1 {
        font-size: 25px;
      }

      .numbers {
        display: grid;
        grid-template-columns: repeat(2, minmax(80px, 1fr));
        gap: 24px 20px;
        max-width: 260px;
        margin: 0 auto;
      }

      .number {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <div class="countdown-wrapper">
    <div class="countdown">

      <h1>Schouw &amp; Co. Capital Markets Day</h1>

      <div class="numbers" id="countdownNumbers">

        <div class="unit">
          <span class="number" id="days">00</span>
          <span class="label">Days</span>
        </div>

        <div class="unit">
          <span class="number" id="hours">00</span>
          <span class="label">Hours</span>
        </div>

        <div class="unit">
          <span class="number" id="minutes">00</span>
          <span class="label">Minutes</span>
        </div>

        <div class="unit">
          <span class="number" id="seconds">00</span>
          <span class="label">Seconds</span>
        </div>

      </div>

      <div class="date">
        8 October 2026 · 09:00 CEST
      </div>

    </div>
  </div>

  <script>
    const targetDate = new Date("2026-10-08T09:00:00+02:00").getTime();

    const daysElement = document.getElementById("days");
    const hoursElement = document.getElementById("hours");
    const minutesElement = document.getElementById("minutes");
    const secondsElement = document.getElementById("seconds");
    const countdownNumbers = document.getElementById("countdownNumbers");

    function updateCountdown() {
      const now = Date.now();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownNumbers.innerHTML =
          '<div class="finished-message">Capital Markets Day has started</div>';

        clearInterval(countdownInterval);
        return;
      }

      const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
      );

      daysElement.textContent = days;
      hoursElement.textContent = String(hours).padStart(2, "0");
      minutesElement.textContent = String(minutes).padStart(2, "0");
      secondsElement.textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();

    const countdownInterval = setInterval(
      updateCountdown,
      1000
    );
  </script>

</body>
</html>
