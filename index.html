<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schouw & Co. Capital Markets Day</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #00425c;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
    }

    .countdown {
      min-height: 320px;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 32px;
      font-size: 36px;
      font-weight: normal;
    }

    .numbers {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .unit {
      min-width: 90px;
    }

    .number {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 42px;
      font-weight: 600;
    }

    .label {
      display: block;
      margin-top: 6px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .date {
      margin-top: 32px;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 27px;
      }

      .numbers {
        gap: 15px;
      }

      .number {
        font-size: 34px;
      }

      .unit {
        min-width: 65px;
      }
    }
  </style>
</head>

<body>

  <div class="countdown">
    <div class="eyebrow">Capital Markets Day</div>

    <h1>Schouw & Co. Capital Markets Day</h1>

    <div class="numbers">
      <div class="unit">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>

      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <div class="date">8 October 2026 · 09:00 CEST</div>
  </div>

  <script>
    const targetDate = new Date("2026-10-08T09:00:00+02:00").getTime();

    function updateCountdown() {
      const now = Date.now();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.querySelector(".numbers").innerHTML =
          "<div class='number'>The event has started</div>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
      );

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
