<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Countdown</title>

  <style>
    * {
      box-sizing: border-box;
      background-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      background: transparent !important;
      background-color: transparent !important;
    }

    body {
      color: #00425c;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .countdown-wrapper {
      width: 100%;
      height: 110px;
      padding: 0 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent !important;
    }

    .numbers {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 48px;

      margin: 0;
      padding: 0;

      background: transparent !important;
    }

    .unit {
      min-width: 92px;
      margin: 0;
      padding: 0;

      text-align: center;

      background: transparent !important;
    }

    .number {
      display: block;

      margin: 0;
      padding: 0;

      font-size: 56px;
      line-height: 0.95;
      font-weight: 700;
      font-variant-numeric: tabular-nums;

      color: #00425c;
      background: transparent !important;
    }

    .label {
      display: block;

      margin: 9px 0 0;
      padding: 0;

      font-size: 12px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      color: #00425c;
      background: transparent !important;
    }

    .finished-message {
      margin: 0;
      padding: 0;

      font-size: 30px;
      font-weight: 700;

      color: #00425c;
      background: transparent !important;
    }

    @media (max-width: 700px) {
      .countdown-wrapper {
        height: 100px;
        padding: 0 6px;
      }

      .numbers {
        gap: 24px;
      }

      .unit {
        min-width: 66px;
      }

      .number {
        font-size: 44px;
      }

      .label {
        margin-top: 7px;
        font-size: 10px;
        letter-spacing: 1px;
      }
    }

    @media (max-width: 440px) {
      .countdown-wrapper {
        height: 90px;
        padding: 0 4px;
      }

      .numbers {
        gap: 12px;
      }

      .unit {
        min-width: 54px;
      }

      .number {
        font-size: 36px;
      }

      .label {
        margin-top: 6px;
        font-size: 8px;
        letter-spacing: 0.8px;
      }
    }
  </style>
</head>

<body>

  <div class="countdown-wrapper">

    <div class="numbers" id="countdownNumbers">

      <div class="unit">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>

      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>

    </div>

  </div>

  <script>
    const targetDate = new Date("2026-10-08T09:00:00+02:00").getTime();

    const daysElement = document.getElementById("days");
    const hoursElement = document.getElementById("hours");
    const minutesElement = document.getElementById("minutes");
    const secondsElement = document.getElementById("seconds");
    const countdownNumbers = document.getElementById("countdownNumbers");

    let countdownInterval;

    function updateCountdown() {
      const now = Date.now();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownNumbers.innerHTML =
          '<div class="finished-message">Event started</div>';

        clearInterval(countdownInterval);
        return;
      }

      const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
      );

      daysElement.textContent = days;
      hoursElement.textContent = String(hours).padStart(2, "0");
      minutesElement.textContent = String(minutes).padStart(2, "0");
      secondsElement.textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();

    countdownInterval = setInterval(
      updateCountdown,
      1000
    );
  </script>

</body>
</html>
