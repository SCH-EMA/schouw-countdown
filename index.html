<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Schouw & Co. Capital Markets Day</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      background: transparent !important;
    }

    body {
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .countdown-wrapper {
      width: 100%;
      height: 180px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
    }

    .countdown {
      width: 100%;
      max-width: 950px;
      text-align: center;
      background: transparent !important;
    }

    h1 {
      margin: 0 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 400;
      color: #ffffff;
      background: transparent;
    }

    .numbers {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 34px;
      background: transparent;
    }

    .unit {
      min-width: 76px;
      background: transparent;
    }

    .number {
      display: block;
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      background: transparent;
    }

    .label {
      display: block;
      margin-top: 7px;
      font-size: 9px;
      line-height: 1;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #ffffff;
      background: transparent;
    }

    .date {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.2;
      color: #ffffff;
      background: transparent;
    }

    .finished-message {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      line-height: 1.2;
      color: #ffffff;
      background: transparent;
    }

    @media (max-width: 700px) {
      .countdown-wrapper {
        height: 190px;
        padding: 16px 14px;
      }

      h1 {
        margin-bottom: 14px;
        font-size: 23px;
      }

      .numbers {
        gap: 18px;
      }

      .unit {
        min-width: 56px;
      }

      .number {
        font-size: 29px;
      }

      .label {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .date {
        margin-top: 14px;
        font-size: 12px;
      }
    }

    @media (max-width: 440px) {
      .countdown-wrapper {
        height: auto;
        min-height: 220px;
        padding: 18px 12px;
      }

      h1 {
        font-size: 21px;
      }

      .numbers {
        display: grid;
        grid-template-columns: repeat(2, minmax(70px, 1fr));
        gap: 18px 14px;
        max-width: 240px;
        margin: 0 auto;
      }

      .number {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="countdown-wrapper">
    <div class="countdown">

      <h1>Schouw &amp; Co. Capital Markets Day</h1>

      <div class="numbers" id="countdownNumbers">

        <div class="unit">
          <span class="number" id="days">00</span>
          <span class="label">Days</span>
        </div>

        <div class="unit">
          <span class="number" id="hours">00</span>
          <span class="label">Hours</span>
        </div>

        <div class="unit">
          <span class="number" id="minutes">00</span>
          <span class="label">Minutes</span>
        </div>

        <div class="unit">
          <span class="number" id="seconds">00</span>
          <span class="label">Seconds</span>
        </div>

      </div>

      <div class="date">
        8 October 2026 · 09:00 CEST
      </div>

    </div>
  </div>

  <script>
    const targetDate = new Date("2026-10-08T09:00:00+02:00").getTime();

    const daysElement = document.getElementById("days");
    const hoursElement = document.getElementById("hours");
    const minutesElement = document.getElementById("minutes");
    const secondsElement = document.getElementById("seconds");
    const countdownNumbers = document.getElementById("countdownNumbers");

    let countdownInterval;

    function updateCountdown() {
      const now = Date.now();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownNumbers.innerHTML =
          '<div class="finished-message">Capital Markets Day has started</div>';

        clearInterval(countdownInterval);
        return;
      }

      const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
      );

      daysElement.textContent = days;
      hoursElement.textContent = String(hours).padStart(2, "0");
      minutesElement.textContent = String(minutes).padStart(2, "0");
      secondsElement.textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();

    countdownInterval = setInterval(
      updateCountdown,
      1000
    );
  </script>

</body>
</html>
